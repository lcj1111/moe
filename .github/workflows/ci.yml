# 作用：验证 CPU 逻辑、配置、发布引用及小型 checkpoint；不运行 GPU 服务。
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装检查依赖
        run: python -m pip install -r requirements-dev.txt
      - name: 检查依赖及仓库
        run: |
          python -m pip check
          make check
      - name: CPU 测试
        run: make test
      - name: Shell 语法
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file" || exit 1
          done < <(git ls-files -z -- '*.sh')

  checkpoint:
    name: CPU checkpoint / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-checkpoint.txt
      - name: 安装 CPU 张量依赖
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-checkpoint.txt
          python -m pip check
      - name: checkpoint 转换测试
        run: python -m pytest tests/test_canonicalize_qwen35_checkpoint.py -q
